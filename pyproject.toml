[project]
name = "llm-mask-ptbr"
version = "0.1.0"
description = "Reversible PII masking proxy for LLM APIs, built for Brazilian Portuguese"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["starlette>=0.40", "httpx>=0.27", "uvicorn>=0.30", "pyyaml>=6"]

[project.optional-dependencies]
ner = ["presidio-analyzer>=2.2", "spacy>=3.7"]

[project.scripts]
llm-mask-ptbr = "llm_mask_ptbr.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["llm_mask_ptbr"]
