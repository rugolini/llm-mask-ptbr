name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[ner]"
      - run: python -m spacy download pt_core_news_sm
      - run: python -m unittest discover -s tests -v

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t llm-mask-ptbr .
      - name: The container starts and answers the health check
        run: |
          docker run -d --name mask -p 8400:8400 -e LLM_MASK_UPSTREAM=http://127.0.0.1:9 llm-mask-ptbr
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:8400/_mask/health && exit 0; sleep 1; done
          docker logs mask; exit 1
